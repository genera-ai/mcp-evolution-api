version: '3.8'

services:
  mcp-evolution-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-evolution-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - API_KEY=${API_KEY}
    restart: unless-stopped
    volumes:
      - mcp-data:/app/data
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  mcp-data:
    name: local
